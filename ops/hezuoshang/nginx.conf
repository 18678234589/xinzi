# 安全响应头：应用页面自己已设置的（如证据页 DENY / 沙箱 CSP、域名页 same-origin 来源策略）保持不变，只补没设置的
map $sent_http_x_frame_options $hz_xfo { "" "SAMEORIGIN"; default ""; }
map $sent_http_x_content_type_options $hz_nosniff { "" "nosniff"; default ""; }
map $sent_http_referrer_policy $hz_referrer { "" "strict-origin-when-cross-origin"; default ""; }
map $sent_http_content_security_policy $hz_csp { "" "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"; default ""; }
server {
    listen 80;
    server_name me.laibangwo.com;
    root /myprograms/hezuoshang;
    index index.php index.html;
    client_max_body_size 120m;
    if (-f /run/hezuoshang/maintenance.flag) { return 503; }
    # 静态资源压缩与缓存：Bootstrap / Font Awesome / jQuery 等第三方库体积大且基本不变，压缩后传输量约减 70%，并让浏览器长期缓存
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf application/x-font-ttf application/vnd.ms-fontobject;
    location ^~ /assets/lib/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location ~* ^/assets/.*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /studio { return 302 /studio/; }
    location ^~ /studio/ {
        proxy_pass http://host.docker.internal:8090;
        proxy_set_header Host me.laibangwo.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        access_log off;
    }
    location ~* ^/(tests|tools|storage|config|includes|classes|algorithms|jobs|migrations|ops)/ { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(sql|log|md|local|sh|bat|ps1|py|bak|ini|ya?ml|env)$ { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php:9000;
        fastcgi_hide_header X-Powered-By;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options $hz_xfo always;
        add_header X-Content-Type-Options $hz_nosniff always;
        add_header Referrer-Policy $hz_referrer always;
        add_header Content-Security-Policy $hz_csp always;
        fastcgi_read_timeout 300s;
    }
}