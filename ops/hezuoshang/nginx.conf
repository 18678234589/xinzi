server {
    listen 80;
    server_name me.laibangwo.com;
    root /myprograms/hezuoshang;
    index index.php index.html;
    client_max_body_size 120m;
    if (-f /run/hezuoshang/maintenance.flag) { return 503; }
    location = /studio { return 302 /studio/; }
    location ^~ /studio/ {
        proxy_pass http://host.docker.internal:8090;
        proxy_set_header Host me.laibangwo.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        access_log off;
    }
    location ~* ^/(tests|tools|storage|config|includes|classes|algorithms|jobs|migrations|ops)/ { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(sql|log|md|local|sh|bat|ps1|py|bak|ini|ya?ml|env)$ { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 300s;
    }
}