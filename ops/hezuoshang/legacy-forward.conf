# Migration forwarder. Original application and configuration are backed up.
server {
    listen 80;
    listen 25480;
    server_name me.laibangwo.com hezuoshang.ousaics.top;
    client_max_body_size 120m;
    location / {
        proxy_pass https://58.58.97.174;
        proxy_ssl_server_name on;
        proxy_ssl_name me.laibangwo.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host me.laibangwo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location ^~ /studio/ {
        proxy_pass https://58.58.97.174;
        proxy_ssl_server_name on;
        proxy_ssl_name me.laibangwo.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host me.laibangwo.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
        access_log off;
    }
}
