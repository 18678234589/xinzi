; 客服绩效采集工具配置
; 编码：本文件必须保存为 UTF-8，避免中文乱码

[server]
; 财务系统的上传地址（把"你的域名"换成实际域名，保留 /caiwu/kefu/upload.php）
url = http://你的域名/kefu/upload.php
; 与服务器 config/cs_perf_config.php 里的 CS_PERF_UPLOAD_TOKEN 保持一致
token = cs_perf_W9x7Km2Q1v3tR8z

[employee]
; 客服自己的姓名（须与财务系统员工管理里的姓名一致）
name =
; 客服自己的旺旺账号（与员工管理里的"旺旺账号"字段一致，用于匹配员工）
wangwang =

[monitor]
; 轮询读取给中的客户端窗口的间隔（秒），一般不用改
interval_sec = 3
